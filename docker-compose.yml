services:
  api:
    build:
      context: .
      target: run
      args:
        VERSION_PREFIX: 1.0.0.0
        VERSION_SUFFIX: docker
    ports:
      - "8080:8080"
    environment:
      DOTNET_ENVIRONMENT: docker
    volumes:
      - movie-reviews-data:/app/data
    networks:
      - cleangraphqlapi_network
    depends_on:
      - seq
  seq:
    image: datalust/seq:2026.1.17473
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    networks:
      - cleangraphqlapi_network
volumes:
  movie-reviews-data:
networks:
  cleangraphqlapi_network:
    driver: bridge
